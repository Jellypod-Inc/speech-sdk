[project]
name = "speech-sdk"
version = "0.1.0"
description = "Universal TTS SDK with multi-provider support"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../../LICENSE" }
authors = [{ name = "Jellypod" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
