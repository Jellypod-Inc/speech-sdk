name: Changelog

on:
  pull_request:
    branches: [main]

jobs:
  require-changelog-on-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check CHANGELOG when package.json version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_VERSION=$(git show "$BASE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          HEAD_VERSION=$(git show "$HEAD_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "Version unchanged; skipping CHANGELOG check."
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md updated alongside version bump ($BASE_VERSION -> $HEAD_VERSION)."
            exit 0
          fi

          echo "::error file=CHANGELOG.md::package.json version changed ($BASE_VERSION -> $HEAD_VERSION) but CHANGELOG.md was not updated. Add an entry for $HEAD_VERSION."
          exit 1
