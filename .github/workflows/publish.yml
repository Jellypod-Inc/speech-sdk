name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: Verify version matches release type
        env:
          IS_PRERELEASE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE_VERSION=true
          else
            IS_PRERELEASE_VERSION=false
          fi
          if [ "$IS_PRERELEASE_VERSION" != "$IS_PRERELEASE_RELEASE" ]; then
            echo "::error::Version '$VERSION' (prerelease=$IS_PRERELEASE_VERSION) does not match GitHub Release prerelease flag ($IS_PRERELEASE_RELEASE). Refusing to publish."
            exit 1
          fi

      - run: npm publish --provenance --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
